
<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diagnóstico ONNX | VisionEPP</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 900px;
      margin: 32px auto;
      padding: 0 16px;
      line-height: 1.5;
    }
    button { padding: 10px 16px; cursor: pointer; }
    button:disabled { cursor: wait; }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: #f2f5f8;
      color: #172b3a;
      padding: 16px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h1>Diagnóstico del modelo ONNX</h1>
  <p>Esta prueba carga el modelo, pero no analiza imágenes.</p>
  <button id="run">Comprobar modelo</button>
  <pre id="output">Pendiente de comprobación.</pre>

  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.min.js"></script>
  <script>
    const output = document.getElementById('output');
    const button = document.getElementById('run');

    function describeMetadata(names, metadata) {
      return names.map((name, index) => {
        const item = metadata?.[index];

        return {
          name,
          metadataAvailable: Boolean(item),
          type: item?.type ?? null,
          shape: item?.shape ?? null,
          isTensor: item?.isTensor ?? null,
          rawMetadata: item ?? null
        };
      });
    }

    button.addEventListener('click', async () => {
      button.disabled = true;
      output.textContent = 'Comprobando biblioteca y modelo…';

      let session;

      try {
        if (!window.ort) {
          throw new Error(
            'No se pudo cargar ONNX Runtime Web desde el CDN.'
          );
        }

        ort.env.wasm.wasmPaths =
          'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/';

        const response = await fetch('./models/PPE-Detection.onnx');

        if (!response.ok) {
          throw new Error(
            `No se encontró el modelo: HTTP ${response.status}.`
          );
        }

        const modelBuffer = await response.arrayBuffer();

        output.textContent =
          `Modelo descargado: ${modelBuffer.byteLength} bytes.\n` +
          'Creando sesión ONNX…';

        session = await ort.InferenceSession.create(
          modelBuffer,
          { executionProviders: ['wasm'] }
        );

        const result = {
          status: 'SESSION_CREATED',
          runtimeVersion: ort.env.versions?.common ?? 'No disponible',
          providerRequested: 'wasm',
          modelBytes: modelBuffer.byteLength,
          inputs: describeMetadata(
            session.inputNames,
            session.inputMetadata
          ),
          outputs: describeMetadata(
            session.outputNames,
            session.outputMetadata
          ),
          note:
            'La sesión se creó; todavía no se ha ejecutado inferencia.'
        };

        output.textContent = JSON.stringify(result, null, 2);

      } catch (error) {
        output.textContent =
          'ERROR DE DIAGNÓSTICO\n' +
          (error?.stack || error?.message || String(error));
      } finally {
        if (session) {
          try {
            await session.release();
          } catch (releaseError) {
            console.warn(
              'No se pudo liberar la sesión de diagnóstico:',
              releaseError
            );
          }
        }

        button.disabled = false;
      }
    });
  </script>
</body>
</html>
